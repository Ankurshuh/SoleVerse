<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SoleKraft – Premium Shoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0d;--paper:#f7f4ef;--warm:#e8e0d5;--accent:#c8502a;
  --accent2:#1a3a2a;--gold:#c9a84c;--text:#2a2a2a;--muted:#7a7a72;
  --ff-display:'Playfair Display',serif;--ff-body:'DM Sans',sans-serif;
}
body{font-family:var(--ff-body);background:var(--paper);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--warm)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(247,244,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--warm);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{font-family:var(--ff-display);font-size:1.5rem;font-weight:900;color:var(--ink);letter-spacing:-0.5px;cursor:pointer}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-link{font-size:.875rem;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .2s}
.nav-link:hover,.nav-link.active{color:var(--ink)}
.nav-actions{display:flex;gap:1rem;align-items:center}
.nav-icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s;position:relative;cursor:pointer}
.nav-icon-btn:hover{background:var(--warm)}
.cart-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--accent);border-radius:50%;font-size:.6rem;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;padding-top:64px}
.hero-content{display:flex;flex-direction:column;justify-content:center;padding:4rem 3rem 4rem 4rem}
.hero-tag{font-size:.75rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem;display:flex;align-items:center;gap:.5rem}
.hero-tag::before{content:'';width:24px;height:1px;background:var(--accent)}
.hero-title{font-family:var(--ff-display);font-size:clamp(3rem,6vw,5.5rem);font-weight:900;line-height:.95;color:var(--ink);margin-bottom:1.5rem;letter-spacing:-2px}
.hero-title em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:1.05rem;color:var(--muted);line-height:1.7;max-width:400px;margin-bottom:2.5rem;font-weight:300}
.hero-ctas{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.btn-primary{background:var(--ink);color:#fff;padding:.85rem 2rem;font-size:.875rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-radius:2px;transition:all .2s}
.btn-primary:hover{background:var(--accent);transform:translateY(-1px)}
.btn-outline{border:1.5px solid var(--ink);color:var(--ink);padding:.85rem 2rem;font-size:.875rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-radius:2px;transition:all .2s}
.btn-outline:hover{background:var(--ink);color:#fff}
.hero-stats{display:flex;gap:2rem;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--warm)}
.stat-num{font-family:var(--ff-display);font-size:1.8rem;font-weight:700;color:var(--ink)}
.stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.hero-visual{background:var(--accent2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-img{width:100%;height:100%;object-fit:cover;opacity:.85;mix-blend-mode:luminosity}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,58,42,.6),rgba(200,80,42,.3))}
.hero-badge{position:absolute;bottom:3rem;left:3rem;background:var(--paper);padding:1.2rem 1.5rem;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.hero-badge-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.25rem}
.hero-badge-val{font-family:var(--ff-display);font-size:1.1rem;font-weight:700;color:var(--ink)}

/* MARQUEE */
.marquee-bar{background:var(--ink);color:#fff;padding:.6rem 0;overflow:hidden;white-space:nowrap}
.marquee-inner{display:inline-block;animation:marquee 25s linear infinite}
.marquee-inner span{font-size:.75rem;letter-spacing:3px;text-transform:uppercase;padding:0 3rem}
.marquee-inner span::after{content:'✦';margin-left:3rem}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* SECTION */
.section{padding:5rem 2rem}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem}
.section-tag{font-size:.75rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
.section-title{font-family:var(--ff-display);font-size:clamp(1.8rem,4vw,3rem);font-weight:900;color:var(--ink);line-height:1.1;letter-spacing:-1px}
.see-all{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--muted);cursor:pointer;transition:color .2s}
.see-all:hover{color:var(--accent);border-color:var(--accent)}

/* FILTERS */
.filters-bar{display:flex;gap:1rem;align-items:center;margin-bottom:2rem;flex-wrap:wrap}
.filter-chip{padding:.4rem 1.2rem;border-radius:20px;font-size:.8rem;font-weight:500;border:1.5px solid var(--warm);background:transparent;color:var(--muted);transition:all .2s;cursor:pointer}
.filter-chip:hover,.filter-chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.sort-select{margin-left:auto;padding:.4rem 1rem;border:1.5px solid var(--warm);border-radius:4px;font-size:.8rem;background:transparent;color:var(--text);cursor:pointer}
.search-bar{display:flex;gap:1rem;margin-bottom:2rem;max-width:500px}
.search-input{flex:1;padding:.7rem 1.2rem;border:1.5px solid var(--warm);border-radius:4px;font-size:.9rem;background:#fff;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--ink)}
.search-btn{background:var(--ink);color:#fff;padding:.7rem 1.5rem;border-radius:4px;font-size:.85rem;font-weight:600;transition:background .2s}
.search-btn:hover{background:var(--accent)}

/* PRODUCTS GRID */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem}
.card{background:#fff;border-radius:6px;overflow:hidden;transition:transform .25s,box-shadow .25s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(0,0,0,.12)}
.card-img-wrap{aspect-ratio:4/3;overflow:hidden;background:var(--warm);position:relative}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img{transform:scale(1.06)}
.card-badge{position:absolute;top:.75rem;left:.75rem;background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:.2rem .6rem;border-radius:2px}
.card-badge.new{background:var(--accent2)}
.card-badge.sale{background:var(--gold);color:var(--ink)}
.card-wishlist{position:absolute;top:.75rem;right:.75rem;width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card:hover .card-wishlist{opacity:1}
.card-body{padding:1.2rem}
.card-brand{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.2rem}
.card-name{font-family:var(--ff-display);font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.5rem}
.card-rating{display:flex;align-items:center;gap:.3rem;margin-bottom:.75rem}
.stars{color:var(--gold);font-size:.8rem}
.rating-num{font-size:.78rem;color:var(--muted)}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-price{font-family:var(--ff-display);font-size:1.2rem;font-weight:700;color:var(--ink)}
.card-price-orig{font-size:.85rem;color:var(--muted);text-decoration:line-through;margin-left:.4rem}
.card-add{background:var(--ink);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all .2s}
.card-add:hover{background:var(--accent);transform:scale(1.1)}

/* PRODUCT DETAIL */
.detail-page{padding:calc(64px + 3rem) 4rem 5rem;max-width:1200px;margin:0 auto}
.detail-back{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);cursor:pointer;margin-bottom:2rem;display:flex;align-items:center;gap:.5rem;transition:color .2s}
.detail-back:hover{color:var(--ink)}
.detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:5rem;align-items:start}
.detail-img-main{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--warm)}
.detail-img-main img{width:100%;height:100%;object-fit:cover}
.detail-brand{font-size:.75rem;text-transform:uppercase;letter-spacing:3px;color:var(--accent);margin-bottom:.5rem}
.detail-name{font-family:var(--ff-display);font-size:2.5rem;font-weight:900;line-height:1;color:var(--ink);margin-bottom:1rem;letter-spacing:-1px}
.detail-rating{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
.detail-prices{margin-bottom:1.5rem}
.detail-price{font-family:var(--ff-display);font-size:2rem;font-weight:700;color:var(--ink)}
.detail-orig{font-size:1.1rem;color:var(--muted);text-decoration:line-through;margin-left:.5rem}
.detail-desc{font-size:.95rem;color:var(--muted);line-height:1.8;margin-bottom:2rem;font-weight:300}
.detail-label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--ink);margin-bottom:.75rem}
.color-options{display:flex;gap:.75rem;margin-bottom:1.5rem}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .2s;position:relative}
.color-swatch.active{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:2px}
.size-options{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
.size-btn{width:48px;height:48px;border:1.5px solid var(--warm);border-radius:4px;font-size:.875rem;font-weight:500;color:var(--muted);transition:all .2s;cursor:pointer}
.size-btn:hover,.size-btn.active{border-color:var(--ink);background:var(--ink);color:#fff}
.detail-actions{display:flex;gap:1rem;margin-bottom:2rem}
.btn-cart{flex:1;background:var(--ink);color:#fff;padding:1rem;font-size:.9rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;transition:all .2s}
.btn-cart:hover{background:var(--accent)}
.btn-wish{width:52px;height:52px;border:1.5px solid var(--warm);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:all .2s;cursor:pointer}
.btn-wish:hover{border-color:var(--accent);color:var(--accent)}
.detail-meta{display:flex;flex-direction:column;gap:.75rem;padding:1.5rem;background:var(--warm);border-radius:4px}
.meta-item{display:flex;align-items:center;gap.75rem;font-size:.875rem;color:var(--muted);gap:.75rem}

/* CART */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;backdrop-filter:blur(4px)}
.cart-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:201;display:flex;flex-direction:column;box-shadow:-8px 0 48px rgba(0,0,0,.15);animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.cart-header{padding:1.5rem 2rem;border-bottom:1px solid var(--warm);display:flex;align-items:center;justify-content:space-between}
.cart-title{font-family:var(--ff-display);font-size:1.4rem;font-weight:700;color:var(--ink)}
.cart-close{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:background .2s;cursor:pointer}
.cart-close:hover{background:var(--warm)}
.cart-items{flex:1;overflow-y:auto;padding:1.5rem 2rem}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1rem;color:var(--muted)}
.cart-empty-icon{font-size:4rem;opacity:.3}
.cart-item{display:grid;grid-template-columns:80px 1fr auto;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--warm)}
.cart-item-img{width:80px;height:80px;border-radius:4px;overflow:hidden;background:var(--warm)}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-name{font-weight:600;color:var(--ink);font-size:.9rem;margin-bottom:.2rem}
.cart-item-meta{font-size:.78rem;color:var(--muted);margin-bottom:.5rem}
.cart-item-qty{display:flex;align-items:center;gap.5rem;gap:.5rem}
.qty-btn{width:26px;height:26px;border:1px solid var(--warm);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size.85rem;font-size:.85rem;cursor:pointer;transition:all .2s}
.qty-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.qty-val{min-width:28px;text-align:center;font-size:.875rem;font-weight:500}
.cart-item-price{font-family:var(--ff-display);font-size:1rem;font-weight:700;color:var(--ink);align-self:start}
.remove-btn{font-size:.75rem;color:var(--muted);cursor:pointer;text-decoration:underline;margin-top:.25rem;display:block}
.remove-btn:hover{color:var(--accent)}
.cart-footer{padding:1.5rem 2rem;border-top:1px solid var(--warm)}
.cart-summary{margin-bottom:1.5rem}
.summary-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted);margin-bottom:.5rem}
.summary-total{display:flex;justify-content:space-between;font-family:var(--ff-display);font-size:1.2rem;font-weight:700;color:var(--ink);padding-top:.75rem;border-top:1px solid var(--warm)}
.checkout-btn{width:100%;background:var(--ink);color:#fff;padding:1rem;font-size:.9rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;transition:all .2s}
.checkout-btn:hover{background:var(--accent)}

/* CHECKOUT */
.checkout-page{padding:calc(64px + 3rem) 4rem 5rem;max-width:900px;margin:0 auto}
.checkout-title{font-family:var(--ff-display);font-size:2.5rem;font-weight:900;color:var(--ink);margin-bottom:.5rem;letter-spacing:-1px}
.checkout-subtitle{color:var(--muted);margin-bottom:3rem;font-weight:300}
.checkout-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:3rem;align-items:start}
.form-section{background:#fff;border-radius:8px;padding:2rem}
.form-section-title{font-weight:600;color:var(--ink);margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid var(--warm)}
.form-group{margin-bottom:1.25rem}
.form-label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:.4rem}
.form-input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--warm);border-radius:4px;font-size:.9rem;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--ink)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.order-summary{background:#fff;border-radius:8px;padding:2rem;position:sticky;top:calc(64px + 2rem)}
.order-item{display:flex;gap.75rem;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--warm)}
.order-item-img{width:56px;height:56px;border-radius:4px;background:var(--warm);overflow:hidden;flex-shrink:0}
.order-item-img img{width:100%;height:100%;object-fit:cover}
.order-item-info{flex:1}
.order-item-name{font-size:.875rem;font-weight:600;color:var(--ink)}
.order-item-meta{font-size:.75rem;color:var(--muted)}
.order-item-price{font-weight:600;font-size:.875rem;color:var(--ink);white-space:nowrap}
.place-order-btn{width:100%;background:var(--accent);color:#fff;padding:1.1rem;font-size:.9rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;transition:all .2s;margin-top:1.5rem}
.place-order-btn:hover{background:var(--ink);transform:translateY(-1px)}

/* SUCCESS */
.success-page{padding:calc(64px + 5rem) 2rem;text-align:center;max-width:600px;margin:0 auto}
.success-icon{font-size:4rem;margin-bottom:1.5rem;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.success-title{font-family:var(--ff-display);font-size:2.5rem;font-weight:900;color:var(--ink);margin-bottom:1rem;letter-spacing:-1px}
.success-sub{color:var(--muted);font-size:1.05rem;line-height:1.7;margin-bottom:2rem;font-weight:300}
.success-order{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:2rem;border:1.5px solid var(--warm)}
.success-order-label{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.25rem}
.success-order-id{font-family:var(--ff-display);font-size:1.5rem;font-weight:700;color:var(--accent)}

/* FOOTER */
.footer{background:var(--ink);color:rgba(255,255,255,.7);padding:4rem 4rem 2rem;margin-top:4rem}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:4rem;margin-bottom:3rem}
.footer-brand{font-family:var(--ff-display);font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:.75rem}
.footer-tagline{font-size:.875rem;line-height:1.7;max-width:260px}
.footer-heading{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:#fff;margin-bottom:1.25rem}
.footer-links{display:flex;flex-direction:column;gap.6rem;gap:.6rem}
.footer-link{font-size:.85rem;cursor:pointer;transition:color .2s}
.footer-link:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:2rem;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--ink);color:#fff;padding:1rem 1.5rem;border-radius:4px;font-size:.875rem;font-weight:500;z-index:300;animation:fadeUp .3s ease;display:flex;align-items:center;gap.75rem;gap:.75rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* UTIL */
.container{max-width:1200px;margin:0 auto}
.text-center{text-align:center}
.mt-4{margin-top:4rem}

/* RESPONSIVE */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-visual{height:50vw}
  .hero-content{padding:3rem 2rem}
  .detail-grid{grid-template-columns:1fr;gap:2rem}
  .checkout-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
}
@media(max-width:600px){
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .section{padding:3rem 1.5rem}
  .detail-page,.checkout-page{padding:calc(64px + 2rem) 1.5rem 3rem}
  .footer{padding:3rem 1.5rem 1.5rem}
  .footer-grid{grid-template-columns:1fr}
  .nav{padding:0 1rem}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, createContext, useContext } = React;

// ─── Mock Data ────────────────────────────────────────────────────
const PRODUCTS = [

// ─── Context ──────────────────────────────────────────────────────
const CartCtx = createContext(null);
function CartProvider({children}){
  const [cart,setCart] = useState([]);
  const [open,setOpen] = useState(false);
  const add = useCallback((product,size,color)=>{
    setCart(c=>{
      const key = `${product.id}-${size}-${color}`;
      const ex = c.find(i=>i.key===key);
      if(ex) return c.map(i=>i.key===key?{...i,qty:i.qty+1}:i);
      return [...c,{key,product,size,color,qty:1}];
    });
    setOpen(true);
  },[]);
  const remove = useCallback(key=>setCart(c=>c.filter(i=>i.key!==key)),[]);
  const updateQty = useCallback((key,d)=>setCart(c=>c.map(i=>i.key===key?{...i,qty:Math.max(1,i.qty+d)}:i)),[]);
  const clear = useCallback(()=>setCart([]),[]);
  const total = cart.reduce((s,i)=>s+i.product.price*i.qty,0);
  const count = cart.reduce((s,i)=>s+i.qty,0);
  return <CartCtx.Provider value={{cart,open,setOpen,add,remove,updateQty,clear,total,count}}>{children}</CartCtx.Provider>;
}
const useCart = ()=>useContext(CartCtx);

// ─── Helpers ──────────────────────────────────────────────────────
const Stars = ({r})=>{
  const full = Math.floor(r), half = r%1>=.5;
  return <span className="stars">{'★'.repeat(full)}{half?'½':''}</span>;
};
const BadgeEl = ({b})=>{
  if(!b) return null;
  const cls = b==='New'?'new':b==='Sale'?'sale':'';
  return <span className={`card-badge ${cls}`}>{b}</span>;
};

// ─── Toast ────────────────────────────────────────────────────────
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t)},[]);
  return <div className="toast">✓ {msg}</div>;
}

          <div className="form-section">
            <div className="form-section-title">Payment Details</div>
            <div className="form-group"><label className="form-label">Card Number *</label><input className="form-input" value={form.card} onChange={set('card')} placeholder="1234 5678 9012 3456" maxLength={19}/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Expiry</label><input className="form-input" value={form.expiry} onChange={set('expiry')} placeholder="MM/YY"/></div>
              <div className="form-group"><label className="form-label">CVV</label><input className="form-input" value={form.cvv} onChange={set('cvv')} placeholder="123" maxLength={4}/></div>
            </div>
          </div>
        </div>
        <div>
          <div className="order-summary">
            <div style={{fontWeight:600,color:'var(--ink)',marginBottom:'1.25rem',paddingBottom:'.75rem',borderBottom:'1px solid var(--warm)'}}>Order Summary</div>
            {cart.map(i=>(
              <div className="order-item" key={i.key}>
                <div className="order-item-img"><img src={i.product.image} alt={i.product.name}/></div>
                <div className="order-item-info">
                  <div className="order-item-name">{i.product.name}</div>
                  <div className="order-item-meta">Size {i.size} · Qty {i.qty}</div>
                </div>
                <div className="order-item-price">${(i.product.price*i.qty).toFixed(2)}</div>
              </div>
            ))}
            <div style={{marginTop:'1rem'}}>
              <div className="summary-row"><span>Subtotal</span><span>${total.toFixed(2)}</span></div>
              <div className="summary-row"><span>Shipping</span><span>{shipping===0?'Free':'$'+shipping.toFixed(2)}</span></div>
              <div className="summary-row"><span>Tax (8%)</span><span>${(total*.08).toFixed(2)}</span></div>
              <div className="summary-total"><span>Total</span><span>${(total+shipping+total*.08).toFixed(2)}</span></div>
            </div>
            <button className="place-order-btn" onClick={handleSubmit} disabled={loading}>
              {loading?'Placing Order…':'Place Order →'}
            </button>
            <div style={{fontSize:'.75rem',color:'var(--muted)',textAlign:'center',marginTop:'1rem'}}>🔒 Secured by 256-bit SSL</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Success Page ─────────────────────────────────────────────────
function SuccessPage({orderId,setPage}){
  return (
    <div className="success-page">
      <div className="success-icon">🎉</div>
      <h1 className="success-title">Order Confirmed!</h1>
      <p className="success-sub">Your new kicks are on their way. We'll send a confirmation email with tracking details shortly.</p>
      <div className="success-order">
        <div className="success-order-label">Order ID</div>
        <div className="success-order-id">{orderId}</div>
      </div>
      <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-primary" onClick={()=>setPage('shop')}>Continue Shopping →</button>
        <button className="btn-outline" onClick={()=>setPage('home')}>Back to Home</button>
      </div>
    </div>
  );
}

// ─── Footer ───────────────────────────────────────────────────────
function Footer(){
  return (
    <footer className="footer">
      <div className="footer-grid">
        <div>
          <div className="footer-brand">SoleKraft</div>
          <p className="footer-tagline">Premium footwear for every journey. From track to street, we've got your feet covered.</p>
        </div>
        <div>
          <div className="footer-heading">Shop</div>
          <div className="footer-links">
            {['Running','Lifestyle','Trail','Casual','Training'].map(c=><span key={c} className="footer-link">{c}</span>)}
          </div>
        </div>
        <div>
          <div className="footer-heading">Support</div>
          <div className="footer-links">
            {['Size Guide','Returns','Shipping','Track Order','FAQs'].map(l=><span key={l} className="footer-link">{l}</span>)}
          </div>
        </div>
        <div>
          <div className="footer-heading">Company</div>
          <div className="footer-links">
            {['About Us','Careers','Press','Sustainability','Contact'].map(l=><span key={l} className="footer-link">{l}</span>)}
          </div>
        </div>
      </div>
      <div className="footer-bottom">
        <span>© 2025 SoleKraft. All rights reserved.</span>
        <span>Powered by FastAPI + React</span>
      </div>
    </footer>
  );
}

// ─── App ──────────────────────────────────────────────────────────
function App(){
  const [page,setPage] = useState('home');
  const [selectedProduct,setSelectedProduct] = useState(null);
  const [orderId,setOrderId] = useState(null);
  return (
    <CartProvider>
      <Nav page={page} setPage={setPage}/>
      <main>
        {page==='home' && <HomePage setPage={setPage} setSelectedProduct={setSelectedProduct}/>}
        {page==='shop' && <ShopPage setPage={setPage} setSelectedProduct={setSelectedProduct}/>}
        {page==='detail' && selectedProduct && <DetailPage product={selectedProduct} setPage={setPage}/>}
        {page==='checkout' && <CheckoutPage setPage={setPage} setOrderId={setOrderId}/>}
        {page==='success' && <SuccessPage orderId={orderId} setPage={setPage}/>}
      </main>
      <Footer/>
      <CartPanel setPage={setPage}/>
    </CartProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
